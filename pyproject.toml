[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "athena-cohortbridge"
version = "0.1.0rc4"
description = "Independent cohort evidence synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Renato Socodato"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4"]
[project.optional-dependencies]
test = ["pytest>=8", "statsmodels>=0.14"]
[project.scripts]
athena-cohortbridge = "athena_cohortbridge.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]
